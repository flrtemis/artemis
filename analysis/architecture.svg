<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1008" role="img" aria-labelledby="title desc">
<title id="title">ARTEMIS proposed unified architecture</title>
<desc id="desc">One frontend and authenticated gateway, shared Python domain services and durable data, with isolated execution, speech, model and world workers. Seven sources, not seven applications.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#6fa49e"/></marker><style>text{font-family:Arial,sans-serif}.tag{font-size:13px;font-weight:700;letter-spacing:2px;fill:#85c5b9}.title{font-size:28px;font-weight:700;fill:#f2f6f3}.h{font-size:18px;font-weight:700;fill:#f0f5f1}.t{font-size:14px;fill:#bacbc7}.n{font-size:13px;fill:#aac1bb}.line{fill:none;stroke:#6fa49e;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="1008" rx="24" fill="#112526"/>
<text x="48" y="44" class="tag">PROPOSED OWNERSHIP &amp; RUNTIME TOPOLOGY</text><text x="48" y="79" class="title">ARTEMIS · one workspace, one continuous actor</text>
<rect x="48" y="111" width="1184" height="105" rx="13" fill="#224342" stroke="#4c8178"/>
<text x="72" y="141" class="tag">ONE USER EXPERIENCE / ONE FRONTEND</text>
<text x="72" y="171" class="h">Conversation · Workspace · Continuity · Lab · Operations · Settings</text>
<text x="72" y="195" class="t">Shared composer, artifacts, Activity and approvals · Presence / facility / Atlas / wrist are projections, not separate apps</text>
<path d="M640 220 V256" class="line"/><text x="665" y="241" class="n">HTTPS + SSE / control WS + realtime audio WS</text>
<rect x="48" y="263" width="1184" height="80" rx="13" fill="#2e4e4b" stroke="#64968a"/>
<text x="72" y="294" class="h">Authenticated gateway &amp; scoped event projections</text><text x="72" y="321" class="t">Session/project/role · strict schemas · safe previews · origin/CSRF controls · no direct browser-to-worker localhost routes</text>
<path d="M640 347 V382" class="line"/>
<rect x="48" y="391" width="1184" height="267" rx="15" fill="#182f2f" stroke="#355b55"/>
<text x="72" y="423" class="tag">SHARED PYTHON DOMAIN SERVICES · MODULAR MONOLITH</text>
<rect x="70" y="442" width="369" height="87" rx="9" fill="#254844"/><text x="88" y="470" class="h">Actor, context &amp; continuity</text><text x="88" y="494" class="t">Agent/task loop · Sage memory/self/affect</text><text x="88" y="514" class="t">Scoped goals, letters, wakes and reviews</text>
<rect x="455" y="442" width="369" height="87" rx="9" fill="#254844"/><text x="473" y="470" class="h">Capabilities, jobs &amp; approvals</text><text x="473" y="494" class="t">Tool policy · durable runs · child jobs</text><text x="473" y="514" class="t">Supervisor, budgets, cancellation, changes</text>
<rect x="840" y="442" width="369" height="87" rx="9" fill="#254844"/><text x="858" y="470" class="h">Workspace &amp; ingestion</text><text x="858" y="494" class="t">Contained files, revisions, artifacts, formats</text><text x="858" y="514" class="t">Search/Atlas, previews and provenance</text>
<rect x="70" y="545" width="369" height="87" rx="9" fill="#254844"/><text x="88" y="573" class="h">Models, speech &amp; Presence</text><text x="88" y="597" class="t">Provider routing, readiness and GPU leases</text><text x="88" y="617" class="t">One audio graph, turn epochs, expressions</text>
<rect x="455" y="545" width="369" height="87" rx="9" fill="#254844"/><text x="473" y="573" class="h">Lab, World &amp; promotion</text><text x="473" y="597" class="t">Independent recipes, units and evaluations</text><text x="473" y="617" class="t">Sensors/controllers, replay, safety and gates</text>
<rect x="840" y="545" width="369" height="87" rx="9" fill="#254844"/><text x="858" y="573" class="h">Events &amp; diagnostics</text><text x="858" y="597" class="t">Causation, schema, visibility and quality</text><text x="858" y="617" class="t">Measured / proxy / simulated / unavailable</text>
<path d="M640 662 V696" class="line"/>
<rect x="48" y="704" width="1184" height="78" rx="12" fill="#3a443a" stroke="#9a9a6d"/><text x="72" y="734" class="h">Durable shared records + scoped artifact storage</text><text x="72" y="759" class="t">SQLite WAL · event/run/approval state · private continuity · content hashes and revisions · model/data/code lineage</text>
<path d="M640 787 V813" class="line"/><path d="M188 815 H1090" fill="none" stroke="#6fa49e" stroke-width="2"/>
<path d="M188 815 V841 M487 815 V841 M786 815 V841 M1084 815 V841" class="line"/>
<rect x="48" y="848" width="282" height="99" rx="11" fill="#283e3c" stroke="#597a70"/><text x="68" y="879" class="h">Sandbox jobs</text><text x="68" y="905" class="t">Code/plugins/media commands</text><text x="68" y="928" class="n">Scoped mounts + denied egress</text>
<rect x="347" y="848" width="282" height="99" rx="11" fill="#283e3c" stroke="#597a70"/><text x="367" y="879" class="h">Speech / realtime</text><text x="367" y="905" class="t">PCM, STT, TTS and cancellation</text><text x="367" y="928" class="n">Local / consented remote adapter</text>
<rect x="646" y="848" width="282" height="99" rx="11" fill="#283e3c" stroke="#597a70"/><text x="666" y="879" class="h">Model / Training / Bio</text><text x="666" y="905" class="t">GPU leases and CPU simulation</text><text x="666" y="928" class="n">Versioned checkpoints/evaluation</text>
<rect x="945" y="848" width="287" height="99" rx="11" fill="#283e3c" stroke="#b09465"/><text x="965" y="879" class="h">Embodied World</text><text x="965" y="905" class="t">Truth → partial sensors → action</text><text x="965" y="928" class="n">Blueprint until implemented/tested</text>
<text x="48" y="981" class="n">Typed, bounded worker contracts · durable control events; bounded high-rate telemetry · one launcher / one public origin</text>
</svg>